name: Daily Podcast Generation

on:
  schedule:
    # 00:30 UTC = 06:00 AM IST daily
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      shloka_reference:
        description: 'Optional verse override (e.g. 2.47 or Bhagavad Gita 2.47)'
        required: false
        default: ''

jobs:
  generate-daily-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Hindi script and upload to R2
        env:
          BHJ_API_BASE_URL: https://bhajjoray-ai-app.kinddesert-f3b90dc1.eastus.azurecontainerapps.io
          SHLOKA_REFERENCE: ${{ github.event.inputs.shloka_reference }}
        run: python scripts/trigger_daily_podcast.py

      - name: Install video synthesis dependencies
        run: |
          pip install --no-cache-dir edge-tts piper-tts onnxruntime opencv-python-headless numpy scipy boto3

      - name: Generate Hindi Sarv lip-sync video and upload to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/generate_daily_videos.py
