name: Python syntax check

on:
  push:
    branches:
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile application and smoke tests
        run: python -m py_compile app.py tests/test_qwen35_smoke.py
