name: Trigger auto deployment for bhajjoray-ai-app

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/bhajjoray-ai-app-AutoDeployTrigger-eadfa388-2a22-4130-b673-89612a21febc.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BHAJJORAYAIAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BHAJJORAYAIAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BHAJJORAYAIAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: bhajjorayreg52.azurecr.io
          registryUsername: ${{ secrets.BHAJJORAYAIAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.BHAJJORAYAIAPP_REGISTRY_PASSWORD }}
          containerAppName: bhajjoray-ai-app
          resourceGroup: rg-ai-projects
          imageToBuild: bhajjorayreg52.azurecr.io/bhajjoray-ai-app:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


